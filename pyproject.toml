[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantum-wave-simulator"
version = "1.0.0"
description = "Interactive 1D and 2D Schrödinger equation simulations with a sparse Crank-Nicolson solver."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gragi-1" }]
keywords = [
  "crank-nicolson",
  "numerical-methods",
  "quantum-mechanics",
  "scientific-computing",
  "schrodinger-equation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
quantum-wave = "quantum_wave.cli:main"

[project.urls]
Homepage = "https://github.com/gragi-1/Wave-equation-numerical-simulation"
Issues = "https://github.com/gragi-1/Wave-equation-numerical-simulation/issues"
Repository = "https://github.com/gragi-1/Wave-equation-numerical-simulation.git"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_wave"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --verbose"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

